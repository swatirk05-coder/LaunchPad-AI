<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaunchPad AI — From Idea to Startup in Minutes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070d; --bg-soft:#080b14; --surface:#0d1220; --surface-2:#131a2c;
    --border:#1c2438; --border-soft:#161d30;
    --text:#f2f4f9; --text-dim:#8d97ad; --text-faint:#5c6579;
    --indigo:#6d6ff5; --indigo-light:#9d9dfb; --violet:#b98af0;
    --green:#35d399; --amber:#f0b357; --red:#ef6a6a;
    --grad: linear-gradient(120deg,#6d6ff5 0%,#b98af0 60%,#35d399 130%);
    --font-d:'Space Grotesk',sans-serif; --font-b:'Inter',sans-serif; --font-m:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-b);line-height:1.6;min-height:100vh;}
  .bg-glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(600px 400px at 12% 6%, rgba(109,111,245,.14), transparent 60%),
      radial-gradient(700px 500px at 90% 18%, rgba(185,138,240,.10), transparent 60%),
      radial-gradient(700px 500px at 50% 100%, rgba(53,211,153,.07), transparent 60%);
  }
  h1,h2,h3{font-family:var(--font-d);font-weight:700;letter-spacing:-0.02em;}
  code,.mono{font-family:var(--font-m);}
  a{color:inherit;}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}

  header{
    position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
    background:rgba(5,7,13,.75);border-bottom:1px solid var(--border-soft);
  }
  nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1180px;margin:0 auto;}
  .logo{font-family:var(--font-d);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--grad);box-shadow:0 0 12px rgba(109,111,245,.8);}
  .logo .ai{color:var(--indigo-light);}
  .header-status{font-family:var(--font-m);font-size:12px;color:var(--text-faint);}
  .header-status b{color:var(--green);}

  main{max-width:980px;margin:0 auto;padding:44px 24px 100px;}


  .stepper{display:flex;overflow-x:auto;gap:0;margin-bottom:48px;border-bottom:1px solid var(--border-soft);padding-bottom:0;}
  .step-tab{
    flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:0 18px 16px;cursor:pointer;position:relative;color:var(--text-faint);
    border-bottom:2px solid transparent;transition:.2s;
  }
  .step-tab .n{
    width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:12px;
    transition:.2s;
  }
  .step-tab .lbl{font-size:12px;font-weight:600;white-space:nowrap;}
  .step-tab.done .n{background:var(--green);border-color:var(--green);color:#04150e;}
  .step-tab.active{color:var(--text);border-bottom-color:var(--indigo-light);}
  .step-tab.active .n{border-color:var(--indigo-light);box-shadow:0 0 0 5px rgba(109,111,245,.14);color:var(--text);}
  .step-tab.locked{cursor:not-allowed;opacity:.4;}


  .panel{animation:fadein .4s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .kicker{font-family:var(--font-m);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .kicker::before{content:'';width:20px;height:1px;background:var(--indigo);}
  .panel h2{font-size:clamp(24px,3.4vw,32px);margin-bottom:10px;}
  .panel .sub{color:var(--text-dim);font-size:15px;max-width:600px;margin-bottom:32px;}


  .field{margin-bottom:20px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text);}
  .field .hint{font-size:12px;color:var(--text-faint);margin-top:6px;}
  input[type=text],input[type=number],textarea,select{
    width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;color:var(--text);font-family:var(--font-b);font-size:14.5px;outline:none;transition:.2s;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--indigo-light);box-shadow:0 0 0 3px rgba(109,111,245,.15);}
  textarea{resize:vertical;min-height:90px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}

  .btn{font-weight:600;font-size:14px;padding:12px 24px;border-radius:10px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;transition:.2s;}
  .btn-primary{background:var(--grad);color:#050712;box-shadow:0 8px 26px -8px rgba(109,111,245,.6);}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--text);}
  .btn-ghost:hover{border-color:var(--indigo);background:var(--surface);}
  .actions{display:flex;gap:12px;margin-top:36px;}

  
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;}
  .card + .card{margin-top:16px;}
  .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:760px){.card-grid{grid-template-columns:1fr;}}
  .stat-num{font-family:var(--font-d);font-size:36px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat-lbl{font-size:12.5px;color:var(--text-dim);margin-top:4px;}

  .bar-row{margin-bottom:16px;}
  .bar-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .bar-row .top b{color:var(--text);}
  .bar-track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;background:var(--grad);width:0%;transition:width 1s ease;}

  ul.tick-list{list-style:none;}
  ul.tick-list li{display:flex;gap:10px;padding:8px 0;font-size:14px;color:var(--text-dim);border-bottom:1px solid var(--border-soft);}
  ul.tick-list li:last-child{border-bottom:none;}
  .tick{flex:none;color:var(--green);}
  .warn{flex:none;color:var(--amber);}

  .badge{display:inline-block;font-family:var(--font-m);font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--indigo-light);background:rgba(109,111,245,.08);margin:3px 6px 3px 0;}

  .health-ring{width:120px;height:120px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;flex:none;
    background:conic-gradient(var(--green) calc(var(--pct,0)*1%), var(--surface-2) 0);}
  .health-ring::before{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--bg);}
  .health-ring span{position:relative;font-family:var(--font-d);font-size:24px;font-weight:700;}
  .health-row{display:flex;align-items:center;gap:28px;flex-wrap:wrap;}

  .competitor-map{position:relative;height:280px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:8px;}
  .competitor-map .axis-x, .competitor-map .axis-y{position:absolute;background:var(--border-soft);}
  .competitor-map .axis-x{left:0;right:0;top:50%;height:1px;}
  .competitor-map .axis-y{top:0;bottom:0;left:50%;width:1px;}
  .competitor-map .axis-label{position:absolute;font-family:var(--font-m);font-size:10px;color:var(--text-faint);}
  .comp-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--indigo);border:2px solid var(--bg);box-shadow:0 0 10px rgba(109,111,245,.6);transform:translate(-50%,-50%);}
  .comp-dot.you{background:var(--green);box-shadow:0 0 14px rgba(53,211,153,.8);width:18px;height:18px;}
  .comp-dot .tag{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:10.5px;font-family:var(--font-m);color:var(--text-dim);white-space:nowrap;}

  .tagline-card{padding:18px 20px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-family:var(--font-d);font-size:16px;margin-bottom:10px;}

  .pitch-section{margin-bottom:22px;}
  .pitch-section h3{font-size:14px;color:var(--indigo-light);margin-bottom:8px;font-family:var(--font-m);text-transform:uppercase;letter-spacing:.06em;}
  .pitch-section p{color:var(--text-dim);font-size:14.5px;}

  .report{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;}
  .report h2{margin-bottom:4px;}
  .report .meta{font-family:var(--font-m);font-size:12px;color:var(--text-faint);margin-bottom:28px;}
  .report hr{border:none;border-top:1px solid var(--border-soft);margin:24px 0;}

  @media print{
    header,.stepper,.actions,.no-print{display:none !important;}
    body{background:#fff;color:#000;}
    .report{border:none;padding:0;}
  }

  ::-webkit-scrollbar{height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>
<div class="bg-glow"></div>

<header>
  <nav>
    <div class="logo"><span class=""></span>LaunchPad<span class="ai"> AI</span></div>
    <div class="header-status">Workspace: <b id="statusLabel">Idle</b></div>
  </nav>
</header>

<main>
  <div class="stepper" id="stepper"></div>
  <div class="panel" id="panel"></div>
</main>

<script>


const STEPS = [
  { key:'landing',  label:'Landing'  },
  { key:'project',  label:'Project'  },
  { key:'check',    label:'AI Check' },
  { key:'strategy', label:'Strategy' },
  { key:'marketing',label:'Marketing'},
  { key:'finance',  label:'Finance'  },
  { key:'pitch',    label:'Pitching' },
  { key:'export',   label:'Export'   },
];

const state = {
  current: 0,
  maxUnlocked: 0,
  project: { name:'', idea:'', industry:'SaaS / Tech', audience:'' },
  check: null,
  strategy: null,
  marketing: null,
  finance: { investment:500000, monthlyCost:40000, price:499, customers:120, marketingSpend:15000, lifetimeMonths:12 },
  financeResult: null,
  pitch: null,
};

function hash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h<<5) - h + str.charCodeAt(i); h |= 0; }
  return Math.abs(h);
}
function seededRand(seed){
  let x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}
function pick(arr, seed){ return arr[Math.floor(seededRand(seed) * arr.length)]; }
function pickN(arr, n, seed){
  const copy = [...arr];
  const out = [];
  for(let i=0;i<n && copy.length;i++){
    const idx = Math.floor(seededRand(seed+i*7) * copy.length);
    out.push(copy.splice(idx,1)[0]);
  }
  return out;
}
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function fmtMoney(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }


const INDUSTRIES = {
  'SaaS / Tech': {
    demand: 78,
    competitors: ['Notion-style workspace tools','Zoho Suite','Generic ChatGPT workflows'],
    channels: ['Product Hunt launch','LinkedIn thought leadership','Developer community (Discord/Reddit)','SEO-driven content'],
    strengths: ['Low marginal cost per user','Fast iteration cycles','Global addressable market'],
    weaknesses: ['Crowded category','High customer expectations for polish','Requires continuous feature velocity'],
  },
  'E-commerce & Retail': {
    demand: 64,
    competitors: ['Established D2C brands','Amazon marketplace sellers','Instagram-native shops'],
    channels: ['Instagram & Meta ads','Influencer seeding','Marketplace listings','Referral programs'],
    strengths: ['Tangible, easy-to-explain value','Word-of-mouth potential','Flexible pricing tiers'],
    weaknesses: ['Thin margins','Logistics & inventory overhead','High customer acquisition cost'],
  },
  'FinTech': {
    demand: 71,
    competitors: ['Neobank apps','UPI-native payment platforms','Traditional bank digital arms'],
    channels: ['Compliance-led PR','Partnership integrations','Referral incentives','Financial content marketing'],
    strengths: ['High willingness to pay for trust','Sticky, recurring usage','Strong data moat over time'],
    weaknesses: ['Heavy regulatory burden','Long trust-building cycle','High infrastructure/security cost'],
  },
  'HealthTech': {
    demand: 69,
    competitors: ['Telehealth platforms','Hospital-affiliated apps','Wellness aggregators'],
    channels: ['Clinician partnerships','Health-content SEO','Insurance tie-ins','Community referrals'],
    strengths: ['Clear, urgent user need','Potential institutional partnerships','Defensible via data & trust'],
    weaknesses: ['Regulatory complexity','Long sales cycles with institutions','Liability sensitivity'],
  },
  'EdTech': {
    demand: 74,
    competitors: ['Byju\'s-style content platforms','YouTube free-learning creators','Institution-led LMS tools'],
    channels: ['Campus ambassador programs','YouTube/Instagram content','Parent & student referrals','Partnerships with colleges'],
    strengths: ['Aligned with a real national push','Repeatable cohort-based model','Community virality among students'],
    weaknesses: ['Free content is a strong substitute','Seasonal demand cycles','Price sensitivity of student users'],
  },
  'Food & Beverage': {
    demand: 58,
    competitors: ['Cloud kitchen chains','Local aggregator listings','Established F&B brands'],
    channels: ['Hyperlocal social ads','Aggregator app listings','Foot-traffic partnerships','Referral offers'],
    strengths: ['Fast repeat-purchase potential','Low education cost for users','Easy to prototype and test'],
    weaknesses: ['Thin margins','Operationally heavy','Geographically constrained'],
  },
  'Sustainability / GreenTech': {
    demand: 61,
    competitors: ['Government-backed green initiatives','Corporate ESG programs','Niche eco-startups'],
    channels: ['ESG partnership outreach','Grant & accelerator visibility','Impact-focused content','B2B pilot programs'],
    strengths: ['Strong narrative & grant eligibility','Growing regulatory tailwinds','Differentiated positioning'],
    weaknesses: ['Long B2B sales cycles','Capital intensity','Market education still early'],
  },
  'Consumer App': {
    demand: 66,
    competitors: ['Category-leading incumbent app','Social-native alternatives','Free utility substitutes'],
    channels: ['App Store optimization','Short-form video (Reels/Shorts)','Referral loops','Community building'],
    strengths: ['Viral growth potential','Low friction to try','Clear engagement metrics'],
    weaknesses: ['Retention is hard to sustain','Monetization often delayed','Platform dependency (app stores)'],
  },
  'Other': {
    demand: 55,
    competitors: ['Adjacent category incumbents','Manual/offline alternatives','DIY substitutes'],
    channels: ['Direct outreach','Niche community engagement','Founder-led content','Partnerships'],
    strengths: ['Founder-market fit potential','Room to define the category','Flexibility to pivot early'],
    weaknesses: ['Unproven demand signal','Category education required','Harder to benchmark against comps'],
  },
};


function runAICheck(){
  const p = state.project;
  const seed = hash(p.name + p.idea);
  const kb = INDUSTRIES[p.industry];
  const clarity = clamp(Math.round((p.idea.length / 4)), 20, 95);
  const audienceScore = p.audience.trim().length > 4 ? 80 : 45;
  const marketDemand = clamp(kb.demand + Math.round(seededRand(seed)*14 - 7), 30, 97);
  const technical = clamp(Math.round((clarity*0.6 + seededRand(seed+1)*40)), 25, 96);
  const financial = clamp(Math.round((audienceScore*0.5 + seededRand(seed+2)*50)), 25, 96);
  const structural = clamp(Math.round((clarity*0.3 + audienceScore*0.3 + seededRand(seed+3)*40)), 25, 96);
  const overall = Math.round((marketDemand*0.35 + technical*0.25 + financial*0.2 + structural*0.2));

  state.check = {
    overall, marketDemand, technical, financial, structural,
    strengths: pickN(kb.strengths, 2, seed+4),
    weaknesses: pickN(kb.weaknesses, 2, seed+5),
    risks: [
      `${pick(kb.competitors, seed+6)} already serves part of this audience — differentiation must be explicit from day one.`,
      audienceScore < 60 ? 'Target audience is loosely defined — sharpen this before spending on acquisition.' : 'Audience is reasonably well-scoped for early positioning.',
    ],
  };
}

function runStrategy(){
  const p = state.project;
  const seed = hash(p.name + p.industry + 'strategy');
  const kb = INDUSTRIES[p.industry];
  const competitors = kb.competitors.map((name,i)=>({
    name,
    marketShare: clamp(20 + seededRand(seed+i)*70, 15, 90),
    innovation: clamp(20 + seededRand(seed+i+10)*70, 15, 90),
  }));
  const you = {
    name: p.name || 'Your startup',
    marketShare: clamp(10 + seededRand(seed+99)*20, 8, 35),
    innovation: clamp(55 + seededRand(seed+98)*35, 50, 95),
  };
  state.strategy = { competitors, you };
}

function runMarketing(){
  const p = state.project;
  const seed = hash(p.name + p.idea + 'marketing');
  const kb = INDUSTRIES[p.industry];
  const nameWord = (p.name || 'Your idea').split(' ')[0];
  const taglineTemplates = [
    `${nameWord}: built for ${p.audience || 'people who move fast'}.`,
    `Stop juggling tools. Start with ${nameWord}.`,
    `${nameWord} — the fastest way from idea to execution.`,
    `Less friction, more launch. Meet ${nameWord}.`,
  ];
  state.marketing = {
    taglines: pickN(taglineTemplates, 3, seed),
    channels: pickN(kb.channels, 3, seed+1),
    adCopy: `${p.idea ? p.idea.slice(0,90) : 'A faster way to get started'}. ${nameWord} helps ${p.audience || 'early users'} skip the busywork and get to results — try it free.`,
  };
}

function runFinance(){
  const f = state.finance;
  const revenuePerMonth = f.price * f.customers;
  const profitPerMonth = revenuePerMonth - f.monthlyCost - f.marketingSpend;
  const breakevenMonths = profitPerMonth > 0 ? Math.ceil(f.investment / profitPerMonth) : null;
  const cac = f.customers > 0 ? f.marketingSpend / f.customers : 0;
  const ltv = f.price * f.lifetimeMonths;
  const ltvCacRatio = cac > 0 ? (ltv / cac) : 0;
  state.financeResult = { revenuePerMonth, profitPerMonth, breakevenMonths, cac, ltv, ltvCacRatio };
}

function runPitch(){
  const p = state.project;
  const c = state.check;
  const s = state.strategy;
  const fr = state.financeResult;
  state.pitch = {
    problem: `Founders and small teams in the ${p.industry} space waste hours stitching together generic tools instead of validating whether ${p.name || 'their idea'} actually works.`,
    solution: p.idea || 'A unified workspace that validates, plans, and packages a startup idea end to end.',
    market: `Estimated market demand index of ${c ? c.marketDemand : '—'}/100 for ${p.industry}, targeting ${p.audience || 'early adopters in this category'}.`,
    businessModel: `Priced at ${fmtMoney(state.finance.price)}/mo per customer, targeting ${state.finance.customers} customers in the first phase, with an LTV:CAC ratio of ${fr ? fr.ltvCacRatio.toFixed(1) : '—'}.`,
    traction: c ? `Business health score of ${c.overall}/100 from LaunchPad AI's feasibility engine, with strongest signal in ${c.marketDemand >= c.technical ? 'market demand' : 'technical feasibility'}.` : '—',
    ask: `Seeking ${fmtMoney(state.finance.investment)} in initial capital to reach breakeven in ${fr && fr.breakevenMonths ? fr.breakevenMonths + ' months' : 'an estimated timeframe pending pricing refinement'}.`,
  };
}


function renderStepper(){
  const el = document.getElementById('stepper');
  el.innerHTML = STEPS.map((s,i)=>{
    const cls = ['step-tab'];
    if(i === state.current) cls.push('active');
    if(i < state.maxUnlocked) cls.push('done');
    if(i > state.maxUnlocked) cls.push('locked');
    return `<div class="${cls.join(' ')}" data-idx="${i}">
      <div class="n">${i < state.maxUnlocked ? '✓' : i+1}</div>
      <div class="lbl">${s.label}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.step-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const idx = parseInt(tab.dataset.idx);
      if(idx <= state.maxUnlocked){ state.current = idx; render(); }
    });
  });
  document.getElementById('statusLabel').textContent =
    state.current === 0 ? 'Idle' : (STEPS[state.current].label + ' in progress');
}

function goto(idx){
  state.current = idx;
  state.maxUnlocked = Math.max(state.maxUnlocked, idx);
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}


function renderPanel(){
  const panel = document.getElementById('panel');
  const key = STEPS[state.current].key;
  panel.innerHTML = '';
  const fn = {
    landing: panelLanding, project: panelProject, check: panelCheck,
    strategy: panelStrategy, marketing: panelMarketing, finance: panelFinance,
    pitch: panelPitch, export: panelExport,
  }[key];
  fn();
}

function panelLanding(){
  document.getElementById('panel').innerHTML = `
    <div class="panel">
      <span class="kicker">Welcome</span>
      <h2>From idea to startup <span class="grad-text">in minutes</span></h2>
      <p class="sub">LaunchPad AI walks you through validation, strategy, marketing, finance, and pitching in one guided workspace — no tab-switching required. Register a project to begin.</p>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
          <div>
            <div style="font-weight:600;margin-bottom:4px;">Start a new workspace</div>
            <div style="color:var(--text-dim);font-size:13.5px;">Takes about 5 minutes end to end.</div>
          </div>
          <button class="btn btn-primary" id="startBtn">Launch a project →</button>
        </div>
      </div>
    </div>`;
  document.getElementById('startBtn').addEventListener('click', ()=> goto(1));
}

function panelProject(){
  const p = state.project;
  document.getElementById('panel').innerHTML = `
    <div class="panel">
      <span class="kicker">Step 2 · Project</span>
      <h2>Initialize your startup profile</h2>
      <p class="sub">Give the AI engine enough to work with. You can refine this later.</p>
      <div class="field">
        <label>Startup name</label>
        <input type="text" id="f-name" placeholder="e.g. LaunchPad AI" value="${p.name}">
      </div>
      <div class="field">
        <label>One-line idea description</label>
        <textarea id="f-idea" placeholder="Describe what you're building and who it's for...">${p.idea}</textarea>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Industry</label>
          <select id="f-industry">
            ${Object.keys(INDUSTRIES).map(k=>`<option value="${k}" ${p.industry===k?'selected':''}>${k}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Target audience</label>
          <input type="text" id="f-audience" placeholder="e.g. college student founders" value="${p.audience}">
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="backBtn">← Back</button>
        <button class="btn btn-primary" id="nextBtn">Run AI feasibility check →</button>
      </div>
    </div>`;
  document.getElementById('backBtn').addEventListener('click', ()=> goto(0));
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    state.project.name = document.getElementById('f-name').value.trim();
    state.project.idea = document.getElementById('f-idea').value.trim();
    state.project.industry = document.getElementById('f-industry').value;
    state.project.audience = document.getElementById('f-audience').value.trim();
    if(!state.project.name || !state.project.idea){
      alert('Add a name and a short idea description so the AI engine has something to analyze.');
      return;
    }
    runAICheck();
    goto(2);
  });
}

function panelCheck(){
  const c = state.check;
  document.getElementById('panel').innerHTML = `
    <div class="panel">
      <span class="kicker">Step 3 · AI Check</span>
      <h2>Feasibility &amp; business health</h2>
      <p class="sub">Instant scoring across market, technical, financial, and structural dimensions.</p>

      <div class="card health-row">
        <div class="health-ring" style="--pct:${c.overall}"><span>${c.overall}</span></div>
        <div style="flex:1;min-width:220px;">
          <div style="font-weight:600;margin-bottom:6px;">Business health score</div>
          <div style="color:var(--text-dim);font-size:13.5px;">A blended read of market demand, technical feasibility, financial soundness, and structural clarity.</div>
        </div>
      </div>

      <div class="card">
        <div class="bar-row"><div class="top"><span>Market demand</span><b>${c.marketDemand}/100</b></div><div class="bar-track"><div class="bar-fill" style="width:${c.marketDemand}%"></div></div></div>
        <div class="bar-row"><div class="top"><span>Technical feasibility</span><b>${c.technical}/100</b></div><div class="bar-track"><div class="bar-fill" style="width:${c.technical}%"></div></div></div>
        <div class="bar-row"><div class="top"><span>Financial soundness</span><b>${c.financial}/100</b></div><div class="bar-track"><div class="bar-fill" style="width:${c.financial}%"></div></div></div>
        <div class="bar-row" style="margin-bottom:0;"><div class="top"><span>Structural clarity</span><b>${c.structural}/100</b></div><div class="bar-track"><div class="bar-fill" style="width:${c.structural}%"></div></div></div>
      </div>

      <div class="grid2">
        <div class="card">
          <div style="font-weight:600;margin-bottom:10px;">Strengths</div>
          <ul class="tick-list">${c.strengths.map(s=>`<li><span class="tick">✓</span>${s}</li>`).join('')}</ul>
        </div>
        <div class="card">
          <div style="font-weight:600;margin-bottom:10px;">Watch-outs</div>
          <ul class="tick-list">${c.weaknesses.map(s=>`<li><span class="warn">!</span>${s}</li>`).join('')}</ul>
        </div>
      </div>

      <div class="card">
        <div style="font-weight:600;margin-bottom:10px;">Risk notes</div>
        <ul class="tick-list">${c.risks.map(r=>`<li><span class="warn">!</span>${r}</li>`).join('')}</ul>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="backBtn">← Back</button>
        <button class="btn btn-primary" id="nextBtn">Continue to strategy →</button>
      </div>
    </div>`;
  document.getElementById('backBtn').addEventListener('click', ()=> goto(1));
  document.getElementById('nextBtn').addEventListener('click', ()=>{ runStrategy(); goto(3); });
}

function panelStrategy(){
  const s = state.strategy;
  const toXY = (obj)=>({ x: obj.innovation, y: 100 - obj.marketShare });
  const dots = [...s.competitors.map(c=>({...c,you:false})), {...s.you, you:true}];
  document.getElementById('panel').innerHTML = `
    <div class="panel">
      <span class="kicker">Step 4 · Strategy</span>
      <h2>Competitor map &amp; positioning</h2>
      <p class="sub">Innovation vs. market share, plotted against the closest players in ${state.project.industry}.</p>

      <div class="competitor-map" id="compMap">
        <div class="axis-x"></div><div class="axis-y"></div>
        <div class="axis-label" style="bottom:6px;right:10px;">Innovation →</div>
        <div class="axis-label" style="top:6px;left:10px;">↑ Market share</div>
      </div>

      <div class="card" style="margin-top:20px;">
        <div style="font-weight:600;margin-bottom:10px;">Direct competitor set</div>
        <ul class="tick-list">
          ${s.competitors.map(c=>`<li><span class="tick">◆</span><b style="color:var(--text);">${c.name}</b>&nbsp;— est. market share ${Math.round(c.marketShare)}%, innovation index ${Math.round(c.innovation)}</li>`).join('')}
        </ul>
      </div>
      <div class="card">
        <div style="font-weight:600;margin-bottom:6px;">Your positioning</div>
        <p style="color:var(--text-dim);font-size:14px;">${state.project.name || 'Your startup'} currently indexes lower on market share (expected, pre-launch) but higher on innovation — the sweet spot is winning on responsiveness and focus while incumbents move slowly.</p>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="backBtn">← Back</button>
        <button class="btn btn-primary" id="nextBtn">Continue to marketing →</button>
      </div>
    </div>`;

  const map = document.getElementById('compMap');
  dots.forEach(d=>{
    const {x,y} = toXY(d);
    const dot = document.createElement('div');
    dot.className = 'comp-dot' + (d.you ? ' you' : '');
    dot.style.left = clamp(x,6,94) + '%';
    dot.style.top = clamp(y,6,94) + '%';
    dot.innerHTML = `<span class="tag">${d.you ? (state.project.name || 'You') : d.name.split(' ').slice(0,2).join(' ')}</span>`;
    map.appendChild(dot);
  });

  document.getElementById('backBtn').addEventListener('click', ()=> goto(2));
  document.getElementById('nextBtn').addEventListener('click', ()=>{ runMarketing(); goto(4); });
}

function panelMarketing(){
  const m = state.marketing;
  document.getElementById('panel').innerHTML = `
    <div class="panel">
      <span class="kicker">Step 5 · Marketing</span>
      <h2>Branding &amp; go-to-market</h2>
      <p class="sub">Auto-generated taglines, channel strategy, and a starting ad copy draft.</p>

      <div style="font-weight:600;margin:20px 0 10px;">Tagline options</div>
      ${m.taglines.map(t=>`<div class="tagline-card">"${t}"</div>`).join('')}

      <div class="card" style="margin-top:12px;">
        <div style="font-weight:600;margin-bottom:10px;">Recommended channels</div>
        <div>${m.channels.map(c=>`<span class="badge">${c}</span>`).join('')}</div>
      </div>

      <div class="card">
        <div style="font-weight:600;margin-bottom:8px;">Sample ad copy</div>
        <p style="color:var(--text-dim);font-size:14.5px;">${m.adCopy}</p>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="backBtn">← Back</button>
        <button class="btn btn-primary" id="nextBtn">Continue to finance →</button>
      </div>
    </div>`;
  document.getElementById('backBtn').addEventListener('click', ()=> goto(3));
  document.getElementById('nextBtn').addEventListener('click', ()=> goto(5));
}

function panelFinance(){
  const f = state.finance;
  document.getElementById('panel').innerHTML = `
    <div class="panel">
      <span class="kicker">Step 6 · Finance</span>
      <h2>Runway &amp; unit economics</h2>
      <p class="sub">Enter rough numbers — LaunchPad AI computes breakeven, CAC, and LTV instantly.</p>

      <div class="grid2">
        <div class="field"><label>Initial investment (CapEx, ₹)</label><input type="number" id="f-inv" value="${f.investment}"></div>
        <div class="field"><label>Monthly operating cost (OpEx, ₹)</label><input type="number" id="f-opex" value="${f.monthlyCost}"></div>
        <div class="field"><label>Price per customer / month (₹)</label><input type="number" id="f-price" value="${f.price}"></div>
        <div class="field"><label>Expected customers / month</label><input type="number" id="f-cust" value="${f.customers}"></div>
        <div class="field"><label>Marketing spend / month (₹)</label><input type="number" id="f-mkt" value="${f.marketingSpend}"></div>
        <div class="field"><label>Average customer lifetime (months)</label><input type="number" id="f-life" value="${f.lifetimeMonths}"></div>
      </div>

      <button class="btn btn-primary" id="calcBtn">Calculate financial model</button>

      <div id="financeOut" style="margin-top:24px;"></div>

      <div class="actions">
        <button class="btn btn-ghost" id="backBtn">← Back</button>
        <button class="btn btn-primary" id="nextBtn" ${state.financeResult ? '' : 'disabled'}>Continue to pitching →</button>
      </div>
    </div>`;

  function renderFinanceOut(){
    const fr = state.financeResult;
    if(!fr) return;
    document.getElementById('financeOut').innerHTML = `
      <div class="card-grid">
        <div class="card"><div class="stat-num">${fmtMoney(fr.revenuePerMonth)}</div><div class="stat-lbl">Projected revenue / month</div></div>
        <div class="card"><div class="stat-num">${fr.profitPerMonth >= 0 ? fmtMoney(fr.profitPerMonth) : '−' + fmtMoney(Math.abs(fr.profitPerMonth))}</div><div class="stat-lbl">Net profit / month</div></div>
        <div class="card"><div class="stat-num">${fr.breakevenMonths ? fr.breakevenMonths + ' mo' : '—'}</div><div class="stat-lbl">Breakeven timeline</div></div>
        <div class="card"><div class="stat-num">${fmtMoney(fr.cac)}</div><div class="stat-lbl">Customer acquisition cost</div></div>
        <div class="card"><div class="stat-num">${fmtMoney(fr.ltv)}</div><div class="stat-lbl">Lifetime value</div></div>
        <div class="card"><div class="stat-num">${fr.ltvCacRatio.toFixed(1)}×</div><div class="stat-lbl">LTV : CAC ratio</div></div>
      </div>
      <div class="card" style="margin-top:16px;">
        <div style="font-weight:600;margin-bottom:6px;">Read</div>
        <p style="color:var(--text-dim);font-size:14px;">
          ${fr.ltvCacRatio >= 3 ? 'A healthy LTV:CAC ratio (3× or better) — this pricing and acquisition mix looks sustainable.' : 'LTV:CAC is under the typical 3× healthy benchmark — consider raising price, improving retention, or lowering acquisition spend.'}
          ${fr.breakevenMonths ? ` At current numbers, breakeven lands around month ${fr.breakevenMonths}.` : ' At current numbers, this model does not reach profitability yet — adjust price, cost, or volume.'}
        </p>
      </div>`;
  }
  renderFinanceOut();

  document.getElementById('calcBtn').addEventListener('click', ()=>{
    f.investment = parseFloat(document.getElementById('f-inv').value) || 0;
    f.monthlyCost = parseFloat(document.getElementById('f-opex').value) || 0;
    f.price = parseFloat(document.getElementById('f-price').value) || 0;
    f.customers = parseFloat(document.getElementById('f-cust').value) || 0;
    f.marketingSpend = parseFloat(document.getElementById('f-mkt').value) || 0;
    f.lifetimeMonths = parseFloat(document.getElementById('f-life').value) || 1;
    runFinance();
    renderFinanceOut();
    document.getElementById('nextBtn').removeAttribute('disabled');
  });
  document.getElementById('backBtn').addEventListener('click', ()=> goto(4));
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(!state.financeResult) return;
    runPitch();
    goto(6);
  });
}

function panelPitch(){
  const pi = state.pitch;
  document.getElementById('panel').innerHTML = `
    <div class="panel">
      <span class="kicker">Step 7 · Pitching</span>
      <h2>Investor pitch narrative</h2>
      <p class="sub">Assembled from everything you've entered so far — edit freely before export.</p>
      <div class="card">
        <div class="pitch-section"><h3>Problem</h3><p>${pi.problem}</p></div>
        <div class="pitch-section"><h3>Solution</h3><p>${pi.solution}</p></div>
        <div class="pitch-section"><h3>Market</h3><p>${pi.market}</p></div>
        <div class="pitch-section"><h3>Business model</h3><p>${pi.businessModel}</p></div>
        <div class="pitch-section"><h3>Traction &amp; validation</h3><p>${pi.traction}</p></div>
        <div class="pitch-section" style="margin-bottom:0;"><h3>The ask</h3><p>${pi.ask}</p></div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="backBtn">← Back</button>
        <button class="btn btn-primary" id="nextBtn">Continue to export →</button>
      </div>
    </div>`;
  document.getElementById('backBtn').addEventListener('click', ()=> goto(5));
  document.getElementById('nextBtn').addEventListener('click', ()=> goto(7));
}

function panelExport(){
  const p = state.project, c = state.check, s = state.strategy, m = state.marketing, fr = state.financeResult, pi = state.pitch;
  document.getElementById('panel').innerHTML = `
    <div class="panel">
      <span class="kicker">Step 8 · Export</span>
      <h2>Your startup report</h2>
      <p class="sub">Review everything in one place, then export as a PDF.</p>

      <div class="report" id="reportRoot">
        <h2>${p.name || 'Untitled startup'}</h2>
        <div class="meta">${p.industry} · Generated by LaunchPad AI</div>

        <div class="pitch-section"><h3>Idea</h3><p>${p.idea}</p></div>
        <hr>
        <div class="pitch-section"><h3>Business health score</h3><p>${c.overall}/100 — market ${c.marketDemand}, technical ${c.technical}, financial ${c.financial}, structural ${c.structural}.</p></div>
        <hr>
        <div class="pitch-section"><h3>Competitor set</h3><p>${s.competitors.map(x=>x.name).join(' · ')}</p></div>
        <hr>
        <div class="pitch-section"><h3>Recommended tagline</h3><p>"${m.taglines[0]}"</p></div>
        <hr>
        <div class="pitch-section"><h3>Financial snapshot</h3><p>Revenue/mo ${fmtMoney(fr.revenuePerMonth)} · Breakeven ${fr.breakevenMonths ? fr.breakevenMonths+' mo' : '—'} · LTV:CAC ${fr.ltvCacRatio.toFixed(1)}×</p></div>
        <hr>
        <div class="pitch-section" style="margin-bottom:0;"><h3>The ask</h3><p>${pi.ask}</p></div>
      </div>

     
    </div>`;
  document.getElementById('backBtn').addEventListener('click', ()=> goto(6));
  document.getElementById('printBtn').addEventListener('click', ()=> window.print());
}


function render(){ renderStepper(); renderPanel(); }
render();
</script>
</body>
</html>
